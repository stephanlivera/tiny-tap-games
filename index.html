<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e25b3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tiny Tap" />
    <meta
      name="description"
      content="Tiny Tap Games: simple educational tap games for little hands."
    />
    <title>Tiny Tap Games</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="home">
    <main class="page">
      <header class="home-head">
        <p class="kicker">For little hands</p>
        <h1 class="site-title">Tiny Tap Games</h1>
        <p class="lede">
          Short, quiet games for young kids.
        </p>
      </header>

      <section class="shelf" aria-label="Games">
        <div class="game-grid">
          <a class="game-card playable" href="games/count/" aria-label="Count the Things">
            <img class="card-photo" src="assets/home/count.webp" alt="" width="840" height="630" />
            <h2>Count</h2>
          </a>

          <a class="game-card playable" href="games/balloon/" aria-label="Balloon Pop">
            <img class="card-photo" src="assets/home/balloon.webp" alt="" width="840" height="630" />
            <h2>Balloons</h2>
          </a>

          <a class="game-card playable" href="games/shapes/" aria-label="Shape Hunt">
            <img class="card-photo" src="assets/home/shapes.webp" alt="" width="840" height="630" />
            <h2>Shapes</h2>
          </a>

          <a class="game-card playable" href="games/peekaboo/" aria-label="Peekaboo Doors">
            <img class="card-photo" src="assets/home/peekaboo.webp" alt="" width="840" height="630" />
            <h2>Peekaboo</h2>
          </a>

          <a class="game-card playable" href="games/match/" aria-label="Match the Pairs">
            <img class="card-photo match-photo" src="assets/home/match.webp" alt="" width="960" height="720" />
            <h2>Pairs</h2>
          </a>

          <a class="game-card playable" href="games/letters/" aria-label="Letter Hunt">
            <img class="card-photo letters-photo" src="assets/home/letters.webp" alt="" width="400" height="300" />
            <h2>Letters</h2>
          </a>
        </div>
      </section>
    </main>
    <script src="js/tablet.js"></script>
  </body>
</html>
