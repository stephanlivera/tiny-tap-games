<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e25b3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tiny Tap" />
    <meta
      name="description"
      content="Balloon Pop: pop the colour you are asked for."
    />
    <title>Balloon Pop · Tiny Tap Games</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <div class="page game-shell">
      <header class="topbar">
        <a class="icon-btn" href="../../" aria-label="Back to games">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <path
              d="M6 15 L16 6 L26 15 V26 H20 V19 H12 V26 H6 Z"
              fill="#2c2118"
            />
          </svg>
        </a>
        <div class="prompt">
          <p class="kicker">Balloon Pop</p>
          <h1 id="prompt">Pop the <span class="color-word" id="prompt-color">red</span></h1>
        </div>
        <button class="icon-btn sound-btn" type="button" data-sound-toggle aria-pressed="false" aria-label="Turn sound off">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M4 12h7l8-7v22l-8-7H4z" fill="currentColor" />
            <path class="sound-waves" d="M22 11.5a5 5 0 0 1 0 9M25.5 8a9 9 0 0 1 0 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
            <path class="sound-slash" d="M8 7.5l16 17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
        </button>
        <div
          class="count-pill swatch-pill"
          id="sample"
          aria-hidden="true"
        ></div>
      </header>

      <section class="playfield sky" id="playfield" aria-label="Balloons">
        <div class="celebrate" id="celebrate">
          <div class="celebrate-card">
            <div class="giant-balloon" id="done-art"></div>
            <div class="word" id="done-word">red</div>
            <p class="caption" id="done-caption">You popped the red balloons</p>
            <button class="next-btn" id="next" type="button">Next</button>
          </div>
        </div>
      </section>
    </div>
    <script src="../../js/tablet.js"></script>
    <script src="../../js/voice.js"></script>
    <script src="game.js"></script>
  </body>
</html>
