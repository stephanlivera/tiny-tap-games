<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdf3e1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tiny Tap" />
    <meta name="description" content="Balloon Pop: pop the balloons of one colour." />
    <title>Balloon Pop · Tiny Tap Games</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="../../assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="topbar">
        <a class="paper-btn" href="../../" aria-label="Back to games">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15 L16 5 L27 15 V27 H19.5 V20 H12.5 V27 H5Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </a>
        <div class="prompt" role="button" tabindex="0" aria-label="Hear it again">
          <span class="chip" id="sample" aria-hidden="true"></span>
          <h1 id="prompt">Pop the <span class="color-word" id="prompt-color">red</span></h1>
          <span class="replay" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 12h6l8-7v22l-8-7H5z" fill="currentColor"/><path d="M23 11.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
        </div>
        <button class="paper-btn sound-btn" type="button" data-sound-toggle aria-pressed="false" aria-label="Turn sound off">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M4 12h7l8-7v22l-8-7H4z" fill="currentColor" />
            <path class="sound-waves" d="M22 11.5a5 5 0 0 1 0 9M25.5 8a9 9 0 0 1 0 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
            <path class="sound-slash" d="M8 7.5l16 17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <section class="playfield" id="playfield" aria-label="Balloons">
        <div class="scene scene-sky"><svg class="clouds" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g style="filter: drop-shadow(0 3px 0 rgba(45,63,69,0.1))"><g fill="#fffdf7"><circle cx="90" cy="110.4" r="24.2"/><circle cx="123" cy="95" r="33"/><circle cx="160.4" cy="108.2" r="26.4"/><rect x="76.8" y="108.2" width="110" height="26.4" rx="13.2"/></g><g fill="#fffdf7"><circle cx="640" cy="92.6" r="19.8"/><circle cx="667" cy="80" r="27"/><circle cx="697.6" cy="90.8" r="21.6"/><rect x="629.2" y="90.8" width="90" height="21.6" rx="10.8"/></g><g fill="#fffdf7"><circle cx="400" cy="184.8" r="15.4"/><circle cx="421" cy="175" r="21"/><circle cx="444.8" cy="183.4" r="16.8"/><rect x="391.6" y="183.4" width="70" height="16.8" rx="8.4"/></g><g fill="#fffdf7"><circle cx="860" cy="196.2" r="17.6"/><circle cx="884" cy="185" r="24"/><circle cx="911.2" cy="194.6" r="19.2"/><rect x="850.4" y="194.6" width="80" height="19.2" rx="9.6"/></g></g></svg><svg class="ground" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true" style="height:24%"><path d="M0 110 C160 30 320 60 480 100 C640 140 800 50 1000 80 V300 H0Z" fill="#9dcf87"/><path d="M0 190 C200 140 380 180 560 190 C720 200 860 150 1000 170 V300 H0Z" fill="#6fb466" style="filter: drop-shadow(0 -3px 0 rgba(45,63,69,0.1))"/></svg></div>
        <div class="celebrate" id="celebrate">
          <div class="celebrate-card">
            <div class="done-art balloon-art" id="done-art"></div>
            <div class="word" id="done-word">red</div>
            <p class="caption" id="done-caption">You popped the red balloons</p>
            <button class="next-btn" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5 L20 12 L6 20.5Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
      </section>
    </div>
    <script src="../../js/tablet.js"></script>
    <script src="../../js/voice.js"></script>
    <script src="../../js/art.js"></script>
    <script src="../../js/fx.js"></script>
    <script src="game.js"></script>
  </body>
</html>
