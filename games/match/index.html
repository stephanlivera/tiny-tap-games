<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e25b3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tiny Tap" />
    <meta
      name="description"
      content="Match the Pairs: flip cards to find matching animals and shapes."
    />
    <title>Match the Pairs · Tiny Tap Games</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <div class="page game-shell">
      <header class="topbar">
        <a class="icon-btn" href="../../" aria-label="Back to games">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <path
              d="M6 15 L16 6 L26 15 V26 H20 V19 H12 V26 H6 Z"
              fill="#2c2118"
            />
          </svg>
        </a>
        <div class="prompt">
          <p class="kicker">Match the Pairs</p>
          <h1 id="prompt">Find the pairs</h1>
        </div>
        <div class="count-pill" id="sample" aria-hidden="true">2</div>
      </header>

      <section class="playfield match-board" id="playfield" aria-label="Cards">
        <div class="match-grid" id="grid"></div>
        <div class="celebrate" id="celebrate">
          <div class="celebrate-card">
            <div class="peek-row" id="done-art"></div>
            <div class="word" id="done-word">matched</div>
            <p class="caption" id="done-caption">You found all the pairs</p>
            <button class="next-btn" id="next" type="button">Next</button>
          </div>
        </div>
      </section>
    </div>
    <script src="../../js/tablet.js"></script>
    <script src="game.js"></script>
  </body>
</html>
